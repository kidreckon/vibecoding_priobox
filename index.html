<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>PrioBox</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="drag-region"></div>

  <header class="app-header">
    <div class="header-text">
      <h1>PrioBox</h1>
      <p class="subtitle">
        Drag to reorder · drag right to finish
        <span id="version-badge" class="version-badge"></span>
      </p>
    </div>
    <button type="button" id="history-btn" class="history-btn" title="Completed tasks">
      History
    </button>
  </header>

  <form id="add-form" class="add-form" autocomplete="off">
    <input id="add-input" type="text" placeholder="Add a task and press Enter…" maxlength="120" />
    <button type="submit" class="add-btn" title="Add task">+</button>
  </form>

  <main class="board">
    <section class="list-col">
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-hint" class="empty-hint">No tasks yet. Add one above to get started.</p>
    </section>

    <section id="done-zone" class="done-zone">
      <div class="done-inner">
        <span class="done-check">✓</span>
        <span class="done-label">Drop here<br />to finish</span>
        <span class="done-count" id="done-count">0 done</span>
      </div>
    </section>
  </main>

  <!-- Timer picker modal -->
  <div id="timer-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="timer-modal-title">Set a countdown</h2>
      <p id="timer-modal-task" class="modal-task"></p>
      <div class="stepper">
        <button type="button" id="dec-btn" class="step-btn" aria-label="Less time">−</button>
        <div class="stepper-value">
          <span id="duration-label">30m</span>
          <span class="stepper-hint">30-minute steps</span>
        </div>
        <button type="button" id="inc-btn" class="step-btn" aria-label="More time">+</button>
      </div>
      <div class="modal-actions">
        <button type="button" id="timer-cancel" class="btn ghost">Cancel</button>
        <button type="button" id="timer-start" class="btn primary">Start</button>
      </div>
    </div>
  </div>

  <!-- Completed-task history -->
  <div id="history-modal" class="modal-overlay" hidden>
    <div class="modal wide">
      <div class="history-head">
        <h2>Completed</h2>
        <button type="button" id="history-close" class="close-btn" title="Close">✕</button>
      </div>

      <div class="history-summary">
        <div class="stat">
          <span class="stat-value" id="stat-count">0</span>
          <span class="stat-label">tasks done</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-time">0m</span>
          <span class="stat-label">time tracked</span>
        </div>
      </div>

      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="empty-hint">
        Nothing finished yet. Drag a task onto the Done zone.
      </p>
      <p id="history-legacy" class="history-legacy" hidden></p>

      <div class="modal-actions">
        <button type="button" id="history-clear" class="btn ghost danger">Clear history</button>
      </div>
      <button type="button" id="reveal-log" class="log-link">Show diagnostics log</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
